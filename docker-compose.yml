services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kishabuzz
      POSTGRES_PASSWORD: kishabuzz
      POSTGRES_DB: kishabuzz
    volumes:
      - kishabuzz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kishabuzz -d kishabuzz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kishabuzz_pg:
